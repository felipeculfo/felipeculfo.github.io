<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moja Wizytówka | Portfolio</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f1f5f9;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }

        h1 {
            margin-bottom: 0.5rem;
            color: var(--accent-color);
        }

        p {
            opacity: 0.8;
            font-size: 0.9rem;
        }

        .skills-list {
            list-style: none;
            padding: 0;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 1.5rem;
        }

        .skills-list li {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-color);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            border: 1px solid var(--accent-color);
        }

        .footer {
            margin-top: 2rem;
            font-size: 0.7rem;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 1rem;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Filippo Culfo</h1>
        <p>Junior Web Developer & Entuzjasta Technologii</p>
        
        <section id="skills">
            <ul class="skills-list">
                <li>Git & GitHub</li>
                <li>HTML5 / CSS3</li>
                <li>VS Code</li>
                <li>Responsive Design</li>
            </ul>
        </section>

        <div class="footer">
            Kod napisany w VSC • Wersjonowany w Git
        </div>
    </div>

</body>
</html>
